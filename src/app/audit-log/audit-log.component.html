<div class="table-container">

  <h2 class="table-title"> <strong>Audit Logs</strong></h2>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Changed By Column -->
    <ng-container matColumnDef="changedBy">
      <th mat-header-cell *matHeaderCellDef> Changed By </th>
      <td mat-cell *matCellDef="let log"> {{ log.userName }} </td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let log"> {{ log.action }} </td>
    </ng-container>

    <!-- Old Value Column -->
    <ng-container matColumnDef="oldValue">
      <th mat-header-cell *matHeaderCellDef> Old Value </th>
      <td mat-cell *matCellDef="let log"> {{ log.oldValue }} </td>
    </ng-container>

    <!-- New Value Column -->
    <ng-container matColumnDef="newValue">
      <th mat-header-cell *matHeaderCellDef> New Value </th>
      <td mat-cell *matCellDef="let log"> {{ log.newValue }} </td>
    </ng-container>

    <!-- Changed At Column -->
    <ng-container matColumnDef="changedAt">
      <th mat-header-cell *matHeaderCellDef> Changed At </th>
      <td mat-cell *matCellDef="let log"> {{ log.timestamp | date:'short' }} </td>
    </ng-container>

    <!-- Device Details Column -->
    <ng-container matColumnDef="deviceDetails">
      <th mat-header-cell *matHeaderCellDef> Device Details </th>
      <td mat-cell *matCellDef="let log"> {{ log.deviceDetails }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator
  [length]="totalLogs"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 20, 50]"
  (page)="onPageChange($event)"
  showFirstLastButtons>
</mat-paginator>
</div>
